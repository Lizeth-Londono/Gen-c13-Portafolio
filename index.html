<!DOCTYPE html>

<html lang="es">

<head>

    <!-- Aquí se define la codificación de caracteres -->
    <!-- charset = permite utilizar tildes, ñ y otros caracteres especiales -->
    <meta charset="UTF-8">

    <!-- Aquí se permite adaptar la página a diferentes tamaños de pantalla -->
    <!-- viewport = controla cómo se visualiza la página en dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Aquí se define el título que aparecerá en la pestaña del navegador -->
    <title>Portafolio | Lizeth Londoño</title>

    <!-- Aquí se prepara la conexión con Google Fonts -->
    <!-- preconnect = permite iniciar antes la conexión con el servidor de las fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!-- Aquí se prepara la conexión con el servidor que entrega los archivos de las fuentes -->
    <!-- crossorigin = permite solicitar recursos desde otro dominio -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Aquí se conectan las tipografías aprobadas para el portafolio -->
    <!-- Barlow Condensed = se utilizará para identidad y títulos -->
    <!-- Inter = se utilizará para navegación, contenido y lectura -->
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Aquí se conecta la hoja de estilos principal -->
    <!-- href = indica la ubicación del archivo CSS -->
    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <!-- Aquí se crea la introducción visual previa al portafolio -->
    <!-- intro-lxl = contiene la secuencia que posteriormente formará la identidad LXL -->
    <section id="intro-lxl" class="intro-lxl">

        <!-- Aquí se crea la retícula principal de la introducción -->
        <!-- intro-reticula = contiene las celdas que posteriormente generará JavaScript -->
        <div class="intro-reticula" aria-hidden="true">

            <!-- Aquí JavaScript generará las celdas de la retícula 14 x 10 -->

            <!-- Cierre retícula de introducción -->
        </div>


        <!-- Aquí se prepara el resultado visual que aparecerá al finalizar la reorganización -->
        <!-- intro-emblema = contiene la versión modular del emblema LIHEN -->
        <div class="intro-emblema" aria-hidden="true">

            <!-- Aquí se crea la retícula interna del emblema -->
            <!-- intro-emblema-reticula = contendrá una matriz de mayor resolución -->
            <div class="intro-emblema-reticula">

                <!-- Aquí JavaScript generará posteriormente las celdas del emblema -->

                <!-- Cierre retícula interna del emblema -->
            </div>

            <!-- Cierre emblema de introducción -->
        </div>


        <!-- Aquí se prepara la identidad que aparecerá después del emblema -->
        <!-- intro-identidad = contiene el bloque LXL y la identidad textual -->
        <div class="intro-identidad">

            <!-- Aquí se prepara el monograma LXL -->
            <span class="intro-identidad-lxl">
                LXL
            </span>

            <!-- Aquí se prepara el concepto principal de identidad -->
            <span class="intro-identidad-marca">
                CODE X LIHEN
            </span>

            <!-- Aquí se prepara el nombre de la identidad -->
            <span class="intro-identidad-nombre">
                LIZETH LONDOÑO
            </span>

            <!-- Cierre identidad final de la introducción -->
        </div>

        <!-- Cierre introducción visual LXL -->
    </section>


    <!-- Aquí se crea el encabezado principal del portafolio -->
    <header class="encabezado-principal">

        <!-- Aquí se crea la navegación principal -->
        <!-- nav = agrupa los enlaces de navegación -->
        <nav class="navegacion-principal">

            <!-- Aquí se crea la lista de enlaces del portafolio -->
            <ul class="navegacion-lista">

                <!-- Aquí se crea el enlace hacia la sección Inicio -->
                <li>

                    <a href="#inicio">
                        Inicio
                    </a>

                </li>

                <!-- Aquí se crea el enlace hacia la sección Sobre mí -->
                <li>

                    <a href="#sobre-mi">
                        Sobre mí
                    </a>

                </li>

                <!-- Aquí se crea el enlace hacia la sección Recorrido -->
                <li>

                    <a href="#recorrido">
                        Recorrido
                    </a>

                </li>

                <!-- Aquí se crea el enlace hacia la sección Proyectos -->
                <li>

                    <a href="#proyectos">
                        Proyectos
                    </a>

                </li>

                <!-- Aquí se crea el enlace hacia la sección Habilidades -->
                <li>

                    <a href="#habilidades">
                        Habilidades
                    </a>

                </li>

                <!-- Aquí se crea el enlace hacia la sección Contacto -->
                <li>

                    <a href="#contacto">
                        Contacto
                    </a>

                </li>

                <!-- Cierre lista de navegación -->
            </ul>

            <!-- Cierre navegación principal -->
        </nav>

        <!-- Cierre encabezado principal -->
    </header>


    <!-- Aquí se crea el contenido principal del portafolio -->
    <main>

        <!-- Aquí se crea la sección principal de presentación -->
        <!-- hero = sección inicial que presenta el portafolio -->
        <section id="inicio" class="hero">

            <!-- Aquí se agrupa el contenido central del hero -->
            <div class="hero-contenido">

                <!-- Aquí se crea la identidad visual LXL -->
                <!-- hero-lxl = bloque reservado para la identidad principal -->
                <div class="hero-lxl" aria-label="Identidad visual LXL">

                    <!-- Aquí se representa temporalmente la identidad LXL con texto -->
                    <!-- Más adelante este bloque podrá transformarse en el monograma visual definitivo -->
                    <span>
                        LXL
                    </span>

                    <!-- Cierre identidad visual LXL -->
                </div>


                <!-- Aquí se muestra el concepto principal de marca -->
                <!-- hero-marca = identifica el concepto CODE X LIHEN -->
                <p class="hero-marca">
                    CODE X LIHEN
                </p>


                <!-- Aquí se muestra el nombre principal -->
                <h1>
                    Lizeth Londoño
                </h1>


                <!-- Aquí se muestra la presentación profesional -->
                <p class="hero-profesion">
                    Junior Full-Stack Java Developer en formación
                </p>


                <!-- Aquí se agrupan las acciones principales del hero -->
                <div class="hero-acciones">

                    <!-- Aquí se crea el enlace principal para visualizar los proyectos -->
                    <a href="#proyectos" class="boton boton-proyectos">
                        Ver proyectos
                    </a>

                    <!-- Aquí se crea el enlace secundario hacia la sección de contacto -->
                    <a href="#contacto" class="boton boton-contacto">
                        Contáctame
                    </a>

                    <!-- Cierre acciones principales del hero -->
                </div>

                <!-- Cierre contenido central del hero -->
            </div>

            <!-- Cierre sección Hero -->
        </section>

        <!-- Cierre contenido principal -->
    </main>


    <!-- Aquí se conecta el archivo principal de JavaScript -->
    <!-- src = indica la ubicación del archivo JavaScript -->
    <script src="js/index.js"></script>

</body>

</html>
